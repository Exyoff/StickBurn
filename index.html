<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#17181a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Bolt by Bolt</title>
<style>
  :root { --bg:#17181a; --panel:rgba(24,25,28,.88); --line:#3a3c41; --ink:#eceae4; --dim:#9a9a94; --acc:#f2b632; --bad:#e2533f; --ok:#59d37c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font:15px/1.35 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:none; overscroll-behavior:none; }
  [hidden] { display:none !important; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  button { font:inherit; color:var(--ink); background:#2a2c30; border:1px solid var(--line); border-radius:10px;
    min-height:44px; padding:0 14px; font-weight:600; }
  button:active { transform:translateY(1px); background:#34363b; }
  button.on { background:var(--acc); color:#1b1503; border-color:var(--acc); }
  button.primary { background:var(--acc); color:#1b1503; border-color:var(--acc); }
  button.danger { background:var(--bad); border-color:var(--bad); color:#fff; }

  #top { position:fixed; left:0; right:0; top:0; display:flex; gap:8px; align-items:center;
    padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 8px calc(10px + env(safe-area-inset-left));
    pointer-events:none; }
  #top > * { pointer-events:auto; }
  #stats { flex:1; min-width:0; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px 10px;
    font-variant-numeric:tabular-nums; font-size:13px; color:var(--dim); }
  #stats b { color:var(--ink); font-size:15px; }
  #bar { height:4px; background:#2e3034; border-radius:2px; margin-top:4px; overflow:hidden; }
  #bar i { display:block; height:100%; width:0; background:var(--acc); transition:width .2s; }

  #bottom { position:fixed; left:0; right:0; bottom:0; display:flex; flex-direction:column; gap:8px;
    padding:8px calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
    background:linear-gradient(transparent, rgba(10,10,11,.75) 40%); pointer-events:none; }
  #bottom > * { pointer-events:auto; }
  #row1 { display:flex; gap:8px; }
  #row1 button { flex:1; }
  #tools { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; touch-action:pan-x; padding-bottom:2px; }
  #tools::-webkit-scrollbar { display:none; }
  #tools button { flex:0 0 auto; min-width:48px; padding:0 8px; font-variant-numeric:tabular-nums; }
  #tools button small { display:block; font-size:9px; font-weight:500; opacity:.7; margin-top:-3px; }

  #strip { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(128px + env(safe-area-inset-bottom));
    width:min(440px, calc(100% - 20px)); background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:8px 8px 8px 12px; display:flex; align-items:center; gap:10px; backdrop-filter:blur(6px); }
  #strip .txt { flex:1; min-width:0; }
  #strip .txt b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #strip .txt span { font-size:12px; color:var(--dim); }
  #strip button { min-height:40px; }

  #toast { position:fixed; left:50%; top:calc(64px + env(safe-area-inset-top)); transform:translateX(-50%);
    max-width:calc(100% - 28px); background:#0d0d0ee6; border:1px solid var(--line); border-radius:10px; padding:8px 14px;
    text-align:center; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }

  #drawer { position:fixed; left:0; right:0; bottom:0; max-height:72%; background:#1b1c1fF2; border-top:1px solid var(--line);
    border-radius:16px 16px 0 0; display:flex; flex-direction:column; backdrop-filter:blur(8px);
    padding-bottom:env(safe-area-inset-bottom); }
  #drawer header { display:flex; align-items:center; padding:10px 12px 6px 16px; }
  #drawer header b { flex:1; font-size:16px; }
  #grid { flex:1; min-height:0; grid-auto-rows:max-content; overflow-y:auto; touch-action:pan-y; display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:8px; padding:6px 12px 14px; }
    .card { display:block; height:auto; background:#26282c; border:1px solid var(--line); border-radius:12px; padding:6px 4px 8px; text-align:center; font-size:12px; line-height:1.2; min-height:0; font-weight:500; }
  .card img { width:100%; aspect-ratio:1; object-fit:contain; display:block; pointer-events:none; }
  #grid p { grid-column:1/-1; color:var(--dim); text-align:center; margin:24px 0; }

  #throttle { position:fixed; right:calc(10px + env(safe-area-inset-right)); top:50%; transform:translateY(-50%);
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 6px; text-align:center; font-size:11px; color:var(--dim); }
  #throttle input { writing-mode:vertical-lr; direction:rtl; height:150px; width:28px; touch-action:none; accent-color:var(--acc); }
  #rpm { color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums; font-size:13px; }

  #modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:18px; }
  #modal .box { background:#1d1e21; border:1px solid var(--line); border-radius:16px; padding:18px; width:min(420px, 100%); max-height:90%; overflow:auto; touch-action:pan-y; }
  #modal h2 { margin:0 0 8px; font-size:20px; letter-spacing:.02em; }
  #modal .body { color:#d0cec8; }
  #modal .body p { margin:8px 0; }
  #modal .body li { margin:6px 0; }
  #modal .body ul { padding-left:20px; margin:8px 0; }
  #modal .acts { display:flex; gap:8px; margin-top:14px; }
  #modal .acts button { flex:1; }
  @media (orientation:landscape) and (max-height:520px) {
    #bottom { flex-direction:row; align-items:flex-end; }
    #row1 { flex:0 0 auto; } #row1 button { flex:0 0 auto; }
    #tools { flex:1; min-width:0; }
    #strip { bottom:calc(66px + env(safe-area-inset-bottom)); }
    #drawer { max-height:88%; }
    #throttle input { height:110px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <div id="stats"><b id="sBolts">0/0</b> bolts · <b id="sParts">0/0</b> parts<div id="bar"><i></i></div></div>
  <button id="startBtn" class="primary">Start</button>
  <button id="menuBtn" aria-label="Menu">☰</button>
</div>

<div id="toast"></div>

<div id="strip" hidden>
  <div class="txt"><b id="stripName"></b><span id="stripSub"></span></div>
  <button id="stripAct"></button>
  <button id="stripClose" aria-label="Close">✕</button>
</div>

<div id="throttle" hidden>
  <div id="rpm">900</div>rpm<br>
  <input id="thr" type="range" min="900" max="5500" value="900" aria-label="Throttle">
</div>

<div id="bottom">
  <div id="row1">
    <button id="partsBtn">Parts <span id="partsN"></span></button>
    <button id="dirBtn">↻ Tighten</button>
  </div>
  <div id="tools"></div>
</div>

<div id="drawer" hidden>
  <header><b>Parts on the shelf</b><button id="drawerClose">Close</button></header>
  <div id="grid"></div>
</div>

<div id="modal" hidden><div class="box"><h2 id="mTitle"></h2><div class="body" id="mBody"></div><div class="acts" id="mActs"></div></div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
